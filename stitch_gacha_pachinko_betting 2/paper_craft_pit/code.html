<script>
    function launchBall() {
      const container = document.getElementById('ball-container');
      const ball = document.createElement('div');
      ball.className = 'pachinko-ball';
      
      // Random starting position at the top
      const startX = 20 + Math.random() * 60; // 20% to 80%
      ball.style.left = startX + '%';
      ball.style.top = '-5%';
      
      container.appendChild(ball);

      let posY = -5;
      let posX = startX;
      let velY = 0;
      let velX = (Math.random() - 0.5) * 0.5;
      const gravity = 0.15;
      const boardHeight = 100;

      const animation = setInterval(() => {
        velY += gravity;
        posY += velY;
        posX += velX;

        // Visual "peg bounce" simulation logic (simplified)
        if (Math.random() > 0.96) {
          velX = (Math.random() - 0.5) * 3;
          velY *= 0.7; // slight dampening on peg hit
        }

        // Wall bounce
        if (posX < 2 || posX > 98) velX *= -0.8;

        ball.style.top = posY + '%';
        ball.style.left = posX + '%';

        // Remove ball when it falls off
        if (posY > boardHeight + 10) {
          clearInterval(animation);
          ball.remove();
        }

        // Check for Jackpot
        if (posY > 85 && posX > 40 && posX < 60) {
          triggerJackpotEffect();
          clearInterval(animation);
          ball.remove();
        }
      }, 30);
    }

    function triggerJackpotEffect() {
      // Simple visual feedback
      const board = document.getElementById('game-board');
      board.classList.add('bg-secondary-fixed');
      setTimeout(() => board.classList.remove('bg-secondary-fixed'), 200);
      
      // Add a floating sticker
      const sticker = document.createElement('div');
      sticker.innerText = "WINNER!";
      sticker.className = "absolute z-50 bg-white border-2 border-on-background px-4 py-2 font-headline-lg text-primary rounded-xl shadow-lg animate-bounce";
      sticker.style.left = "50%";
      sticker.style.top = "50%";
      sticker.style.transform = "translate(-50%, -50%) rotate(-5deg)";
      document.body.appendChild(sticker);
      setTimeout(() => sticker.remove(), 2000);
    }
  </script>
